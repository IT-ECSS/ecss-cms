
name: ECSS CMS - Django

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check if Django directory exists
        run: |
          if [ -d "djangoPython" ]; then
            echo "✓ djangoPython directory found"
            ls -la djangoPython/
          else
            echo "⚠️  djangoPython directory not found, skipping Django deployment"
            exit 0
          fi

      - name: Install dependencies
        working-directory: djangoPython
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployment package
        run: |
          cd djangoPython
          zip -r ../django-deploy.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "venv/*" \
            --exclude ".DS_Store" \
            --exclude "db.sqlite3" \
            --exclude "media/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Clean up wwwroot to free disk space
        uses: azure/CLI@v2
        with:
          inlineScript: |
            CREDS=$(az webapp deployment list-publishing-credentials \
              --name ecss-backend-django \
              --resource-group ECSS-Course-Management-System \
              --query "{username: publishingUserName, password: publishingPassword}" \
              -o json)
            USERNAME=$(echo $CREDS | jq -r '.username')
            PASSWORD=$(echo $CREDS | jq -r '.password')
            curl -s -u "$USERNAME:$PASSWORD" \
              -X DELETE \
              "https://ecss-backend-django.scm.azurewebsites.net/api/vfs/site/wwwroot/" \
              -H "If-Match: *" || true

      - name: 'Deploy to Azure Web App (Django)'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ecss-backend-django'
          slot-name: 'Production'
          package: './django-deploy.zip'
          deployment-method: zipDeploy
          