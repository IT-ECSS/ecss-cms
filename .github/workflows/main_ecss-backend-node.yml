name: ECSS CMS - Node

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Validate Required Secrets
        run: |
          MISSING_SECRETS=()
          
          if [ -z "${{ secrets.ONESIGNAL_APP_ID }}" ]; then
            MISSING_SECRETS+=("ONESIGNAL_APP_ID")
            echo "ERROR: ONESIGNAL_APP_ID secret is not set!"
          fi
          if [ -z "${{ secrets.ONESIGNAL_API_KEY }}" ]; then
            MISSING_SECRETS+=("ONESIGNAL_API_KEY")
            echo "ERROR: ONESIGNAL_API_KEY secret is not set!"
          fi
          if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_NORSE }}" ]; then
            MISSING_SECRETS+=("GOOGLE_SERVICE_ACCOUNT_NORSE")
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_NORSE secret is not set!"
          fi
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo ""
            echo "Please add missing secrets to:"
            echo "https://github.com/IT-ECSS/ecss-cms/settings/secrets/actions"
            exit 1
          fi
          
          echo "✓ All required secrets are configured"

      - name: Install dependencies and build (backend)
        working-directory: backend
        run: |
          npm ci --prefer-offline --no-audit
          npm run build --if-present

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../node-deploy.zip . \
            --exclude "node_modules/*" \
            --exclude "*.log" \
            --exclude ".DS_Store" \
            --exclude ".git/*" \
            --exclude "*.map" \
            --exclude ".env*" \
            --exclude "test/*" \
            --exclude "*.md"
          echo "Package size: $(du -h ../node-deploy.zip | cut -f1)"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure App Settings for OneSignal and Google Drive
        run: |
          az webapp config appsettings set \
            --resource-group ECSS-Course-Management-System \
            --name ecss-backend-node \
            --settings \
              ONESIGNAL_APP_ID="${{ secrets.ONESIGNAL_APP_ID }}" \
              ONESIGNAL_API_KEY="${{ secrets.ONESIGNAL_API_KEY }}" \
              GOOGLE_DRIVE_FOLDER_ID="1DF81mvA5pv8_X-_uP8528Vb1xNfs1D8M" \
              GOOGLE_SERVICE_ACCOUNT_NORSE='${{ secrets.GOOGLE_SERVICE_ACCOUNT_NORSE }}' \
              NODE_ENV="production" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false"
          echo "✓ All settings configured in Azure"

      - name: Configure Google Drive Credentials
        run: |
          mkdir -p ./backend/config
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_NORSE }}" > ./backend/config/norse-study-479913-b7-00b6903f8f4f.json
          echo "✓ Google Drive credentials file created"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ecss-backend-node'
          slot-name: 'Production'
          package: ./node-deploy.zip
        timeout-minutes: 10

      - name: Verify deployment health
        run: |
          echo "Waiting for app to be ready..."
          sleep 30
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://ecss-backend-node.azurewebsites.net/health 2>/dev/null || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ Deployment verified - App is running"
          elif [ "$RESPONSE" = "404" ]; then
            echo "✓ App is running (health endpoint not found - expected)"
          else
            echo "⚠ Warning: Unexpected response code: $RESPONSE"
          fi
        continue-on-error: true

      - name: Output deployment summary
        run: |
          echo "========== Deployment Summary =========="
          echo "App Name: ecss-backend-node"
          echo "URL: https://ecss-backend-node.azurewebsites.net"
          echo "Resource Group: ECSS-Course-Management-System"
          echo "========================================"