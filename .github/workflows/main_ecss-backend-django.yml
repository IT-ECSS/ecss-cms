# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: ECSS CMS - Django

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'

      - name: Check if Django directory exists
        run: |
          if [ -d "djangoPython" ]; then
            echo "✓ djangoPython directory found"
            ls -la djangoPython/
          else
            echo "⚠️  djangoPython directory not found, skipping Django deployment"
            exit 1
          fi

      - name: Install dependencies into deployment package
        working-directory: djangoPython
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Create deployment package
        run: |
          cd djangoPython
          zip -r ../django-deploy.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".DS_Store" \
            --exclude "db.sqlite3" \
            --exclude "media/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4FECCB8738974CFFB45BF0BAA3F41DE5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_171130E8D32C4CA8BE4721794C632D84 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_019C65756BC44E35992611AD25F859E1 }}

      - name: 'Deploy to Azure Web App (Django)'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ecss-backend-django'
          slot-name: 'Production'
          package: './django-deploy.zip'
          startup-command: 'gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 djangoPython.wsgi:application'
          