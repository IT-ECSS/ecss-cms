
name: ECSS CMS - Django

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check if Django directory exists
        run: |
          if [ -d "djangoPython" ]; then
            echo "✓ djangoPython directory found"
            ls -la djangoPython/
          else
            echo "⚠️  djangoPython directory not found, skipping Django deployment"
            exit 0
          fi

      - name: Install dependencies into package bundle
        working-directory: djangoPython
        run: |
          pip install -r requirements.txt --target=".python_packages/lib/site-packages" --no-cache-dir

      - name: Create deployment package
        run: |
          cd djangoPython
          zip -r ../django-deploy.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "venv/*" \
            --exclude ".DS_Store" \
            --exclude "db.sqlite3" \
            --exclude "media/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service settings
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name ecss-backend-django \
              --resource-group ECSS-Course-Management-System \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                         PYTHONPATH="/home/site/wwwroot/.python_packages/lib/site-packages"
            az webapp config set \
              --name ecss-backend-django \
              --resource-group ECSS-Course-Management-System \
              --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 djangoPython.wsgi"

      - name: 'Deploy to Azure Web App (Django)'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ecss-backend-django'
          slot-name: 'Production'
          package: './django-deploy.zip'
          deployment-method: zipDeploy
          