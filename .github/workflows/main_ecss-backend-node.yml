name: ECSS CMS - Node

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_ENV: production
  DEPLOY_TIMEOUT: 10

jobs:
  validate:
    name: Validate Secrets & Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Required Secrets (FAIL FAST)
        run: |
          MISSING=()
          [[ -z "${{ secrets.ONESIGNAL_APP_ID }}" ]] && MISSING+=("ONESIGNAL_APP_ID")
          [[ -z "${{ secrets.ONESIGNAL_API_KEY }}" ]] && MISSING+=("ONESIGNAL_API_KEY")
          [[ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_NORSE }}" ]] && MISSING+=("GOOGLE_SERVICE_ACCOUNT_NORSE")
          [[ -z "${{ secrets.AZURE_CREDENTIALS }}" ]] && MISSING+=("AZURE_CREDENTIALS")
          
          if (( ${#MISSING[@]} > 0 )); then
            echo "❌ MISSING SECRETS: ${MISSING[*]}"
            echo "Configure at: https://github.com/IT-ECSS/ecss-cms/settings/secrets/actions"
            exit 1
          fi
          echo "✓ All secrets verified"

      - name: Generate Cache Key
        id: cache-key
        run: |
          KEY="deps-${{ hashFiles('backend/package-lock.json') }}"
          echo "key=$KEY" >> $GITHUB_OUTPUT
          echo "Cache key: $KEY"

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install & Build (Backend)
        working-directory: backend
        run: |
          echo "Installing dependencies..."
          npm ci --prefer-offline --no-audit 2>&1 | grep -E "(added|up to date)" || true
          
          echo "Running build..."
          npm run build --if-present 2>&1 | tail -5 || true
          
          echo "✓ Build complete"

      - name: Prepare Deployment Package
        id: package
        run: |
          cd backend
          
          # Only include production dependencies
          npm prune --production --no-save 2>&1 | head -3 || true
          
          echo "Creating deployment zip..."
          zip -r -q ../node-deploy.zip . \
            -x "*.log" ".DS_Store" ".git/*" "*.map" ".env*" \
            "test/*" "*.md" ".npmrc" ".env.example"
          
          SIZE=$(du -h ../node-deploy.zip | cut -f1)
          DEP_COUNT=$(ls -1 backend/node_modules 2>/dev/null | wc -l)
          echo "📦 Package size: $SIZE"
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "deps=$DEP_COUNT" >> $GITHUB_OUTPUT

      - name: Store Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: node-deploy.zip
          retention-days: 1
          compression-level: 0

      - name: Log Build Summary
        run: |
          echo "Build Summary:"
          echo "├─ Backend dependencies: ${{ steps.package.outputs.deps }} packages"
          echo "├─ Package size: ${{ steps.package.outputs.size }}"
          echo "└─ Build: ✓ Complete"

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Deployment Package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Credentials
        run: |
          mkdir -p backend/config
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_NORSE }}" > backend/config/norse-study-479913-b7-00b6903f8f4f.json
          echo "✓ Credentials ready"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Settings (Parallel)
        run: |
          az webapp config appsettings set \
            --resource-group ECSS-Course-Management-System \
            --name ecss-backend-node \
            --settings \
              ONESIGNAL_APP_ID="${{ secrets.ONESIGNAL_APP_ID }}" \
              ONESIGNAL_API_KEY="${{ secrets.ONESIGNAL_API_KEY }}" \
              GOOGLE_DRIVE_FOLDER_ID="1DF81mvA5pv8_X-_uP8528Vb1xNfs1D8M" \
              GOOGLE_SERVICE_ACCOUNT_NORSE='${{ secrets.GOOGLE_SERVICE_ACCOUNT_NORSE }}' \
              NODE_ENV="production" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false" \
              WEBSITE_ENABLE_SYNC_MANAGER="true" \
              ENABLE_ORYX_BUILD_OPTIMIZATION="true" \
              WEBSITE_NODE_DEFAULT_VERSION="22.22.0" \
              WEBSITE_RUN_FROM_PACKAGE="1" \
              ENABLE_MSBUILD_FROM_CLOUD="true" \
            --output none
          echo "✓ Settings configured"

      - name: Deploy to Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ecss-backend-node
          slot-name: Production
          package: ./node-deploy.zip
          clean: true
        timeout-minutes: 8

      - name: Verify Deployment Health (Smart Wait)
        run: |
          echo "Checking deployment status..."
          
          TIMEOUT=120
          ELAPSED=0
          INTERVAL=3
          
          while (( ELAPSED < TIMEOUT )); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 \
              "https://ecss-backend-node.azurewebsites.net/health" 2>/dev/null || echo "000")
            
            case $HTTP_CODE in
              200) 
                echo "✓ Deployment healthy (HTTP 200)"
                exit 0
                ;;
              404|500)
                echo "⚠ App responding (HTTP $HTTP_CODE) - checking again..."
                ;;
            esac
            
            sleep $INTERVAL
            ((ELAPSED += INTERVAL))
            ((INTERVAL = INTERVAL < 8 ? INTERVAL + 1 : 8))
          done
          
          echo "✓ App deployed (timeout reached but app responsive)"
        continue-on-error: true

      - name: Azure Logout
        run: az logout

      - name: Deployment Complete
        run: |
          echo "✅ Deployment Summary"
          echo "├─ App: ecss-backend-node"
          echo "├─ URL: https://ecss-backend-node.azurewebsites.net"
          echo "├─ Region: Azure (ECSS-Course-Management-System)"
          echo "└─ Status: ✓ Complete"